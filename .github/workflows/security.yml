name: Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit

      # Fails the build (non-zero exit) if Bandit reports any Medium or
      # High severity finding. -ll sets the severity threshold to
      # "medium and above"; -r scans recursively from the repo root.
      - name: Run Bandit SAST scan
        run: bandit -r . -ll

      # Optional additional-credit step: broader ruleset via Semgrep.
      - name: Run Semgrep (python ruleset)
        uses: semgrep/semgrep-action@v1
        with:
          config: p/python
        continue-on-error: false
